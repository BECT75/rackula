name: RC2 Security Audit

on:
  push:
    branches:
      - 'security/rc2-npm-audit'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install exact RC2 dependencies
        run: npm ci

      - name: Audit complete dependency graph
        shell: bash
        run: |
          npm audit --json > npm-audit-all.json || true
          cat npm-audit-all.json

      - name: Audit production dependencies only
        shell: bash
        run: |
          npm audit --omit=dev --json > npm-audit-prod.json || true
          cat npm-audit-prod.json

      - name: Print normalized audit summary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const [label, file] of [['all', 'npm-audit-all.json'], ['production', 'npm-audit-prod.json']]) {
            const audit = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(`=== ${label.toUpperCase()} ===`);
            console.log(JSON.stringify(audit.metadata?.vulnerabilities ?? {}, null, 2));
            for (const [name, finding] of Object.entries(audit.vulnerabilities ?? {})) {
              console.log(JSON.stringify({
                name,
                severity: finding.severity,
                isDirect: finding.isDirect,
                via: finding.via,
                effects: finding.effects,
                range: finding.range,
                nodes: finding.nodes,
                fixAvailable: finding.fixAvailable
              }, null, 2));
            }
          }
          NODE

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: rc2-npm-audit
          path: |
            npm-audit-all.json
            npm-audit-prod.json
          if-no-files-found: error
          retention-days: 90
