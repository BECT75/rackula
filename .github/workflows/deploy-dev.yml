name: Deploy Dev

on:
  workflow_dispatch:

# This workflow belongs to the upstream Rackula infrastructure. The BECT75 fork
# does not own the upstream self-hosted runner label `vps-rackula` nor the
# upstream dev host `d.racku.la`. Keeping the inherited deploy active in the fork
# creates permanently queued jobs because no compatible runner is registered in
# this repository.
#
# CT pilot qualification is performed by ct-pilot.yml on GitHub-hosted runners.
# A future BECT75 VPS deployment must use a runner and hostname owned by BECT75,
# and should be implemented in a dedicated workflow rather than reusing the
# upstream environment.

jobs:
  upstream-only:
    name: Upstream VPS deploy disabled in fork
    if: ${{ github.repository == 'RackulaLives/Rackula' }}
    runs-on: [self-hosted, vps-rackula]
    steps:
      - name: Guard
        run: echo "This workflow is only valid in RackulaLives/Rackula."
