name: BECT75 Production Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - deploy/bect75-prod-release.json
      - .github/workflows/bect75-prod-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bect75-production-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build homologated production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      production_url: ${{ steps.release.outputs.production_url }}
      application_version: ${{ steps.release.outputs.application_version }}
      source_ref: ${{ steps.release.outputs.source_ref }}
      source_short: ${{ steps.source.outputs.short }}
    steps:
      - name: Checkout deployment control files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Read pinned BECT75 production release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const release = JSON.parse(fs.readFileSync('deploy/bect75-prod-release.json', 'utf8'));
          for (const key of ['sourceRef', 'applicationVersion', 'basePath', 'productionUrl']) {
            if (!release[key]) throw new Error(`missing ${key}`);
          }
          if (!/^[0-9a-f]{40}$/.test(release.sourceRef)) throw new Error('sourceRef must be a full immutable commit SHA');
          if (release.basePath !== '/rackula/') throw new Error(`unexpected basePath ${release.basePath}`);
          if (release.productionUrl !== 'https://bect75.github.io/rackula/') throw new Error(`unexpected productionUrl ${release.productionUrl}`);
          console.log(`source_ref=${release.sourceRef}`);
          console.log(`application_version=${release.applicationVersion}`);
          console.log(`base_path=${release.basePath}`);
          console.log(`production_url=${release.productionUrl}`);
          NODE

      - name: Checkout exact homologated source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert immutable source identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ steps.release.outputs.source_ref }}"
          test "$actual" = "$expected"
          short="$(git rev-parse --short HEAD)"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "Building homologated source $actual ($short)"

      - name: Install dependencies
        run: npm ci

      - name: Build for BECT75 production sub-path
        env:
          VITE_ENV: production
          VITE_BASE_PATH: /rackula/
        run: npm run build

      - name: Adapt static root references in built HTML only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const files = ['dist/index.html', 'dist/login.html'];
          const refs = ['/favicon.png', '/favicon-light.png', '/favicon.ico', '/apple-touch-icon.png', '/config.js'];
          for (const file of files) {
            let html = fs.readFileSync(file, 'utf8');
            for (const ref of refs) html = html.split(`\"${ref}\"`).join(`\"/rackula${ref}\"`);
            fs.writeFileSync(file, html);
          }
          NODE
          touch dist/.nojekyll

      - name: Verify production artifact identity and configuration
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.application_version }}
          EXPECTED_COMMIT: ${{ steps.source.outputs.short }}
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/version.json
          test -f dist/config.js
          grep -Eq 'storage:[[:space:]]*"browser"' dist/config.js
          grep -Fq "\"version\": \"${EXPECTED_VERSION}\"" dist/version.json
          grep -Fq "\"commit\": \"${EXPECTED_COMMIT}\"" dist/version.json
          grep -Fq '/rackula/config.js' dist/index.html
          grep -Fq '/rackula/favicon.png' dist/index.html
          grep -Eq '(src|href)="/rackula/' dist/index.html
          if grep -Eq '(src|href)="/(config\.js|favicon\.png|favicon-light\.png|favicon\.ico|apple-touch-icon\.png)' dist/index.html dist/login.html; then
            echo 'Root-absolute static reference remains in production artifact' >&2
            exit 1
          fi
          echo "Artifact verified: ${EXPECTED_VERSION} @ ${EXPECTED_COMMIT}"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy BECT75 production
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify BECT75 production
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy
    timeout-minutes: 10
    steps:
      - name: Post-deployment HTTP smoke
        shell: bash
        env:
          BASE_URL: ${{ needs.build.outputs.production_url }}
          EXPECTED_VERSION: ${{ needs.build.outputs.application_version }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.source_short }}
        run: |
          set -euo pipefail
          retry_curl() {
            curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors "$1"
          }
          html="$(retry_curl "$BASE_URL")"
          version="$(retry_curl "${BASE_URL}version.json")"
          config="$(retry_curl "${BASE_URL}config.js")"
          printf '%s' "$html" | grep -Fq 'Rackula - Rack Layout Designer'
          printf '%s' "$version" | grep -Fq "\"version\": \"${EXPECTED_VERSION}\""
          printf '%s' "$version" | grep -Fq "\"commit\": \"${EXPECTED_COMMIT}\""
          printf '%s' "$config" | grep -Eq 'storage:[[:space:]]*"browser"'
          curl --fail --silent --show-error --head --location --retry 12 --retry-delay 5 --retry-all-errors "$BASE_URL" >/dev/null
          echo "BECT75 production PASS: ${EXPECTED_VERSION} @ ${EXPECTED_COMMIT}"
